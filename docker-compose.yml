services:
  scrypted:
    image: ghcr.io/koush/scrypted:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/scrypted-data:/server/volume
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:10443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
